<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Title }}, {{ .Site.Params.department }}{{ end }}">

 <!-- 폰트: 이 저장소의 static/fonts/ 파일을 직접 씁니다. 외부 CDN 없음 -->
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="{{ "fonts/inter-latin-standard-normal.woff2" | relURL }}">
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="{{ "fonts/newsreader-latin-standard-normal.woff2" | relURL }}">
  <link rel="stylesheet" href="{{ "fonts/fonts.css" | relURL }}">
  <link rel="stylesheet" href="{{ "fonts/pretendard/pretendard.css" | relURL }}">
  
  <link rel="icon" href="{{ "favicon.ico" | relURL }}" sizes="any">
  <link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
