<header class="site-head">
  <div class="wrap site-head-inner">
    <a class="wordmark" href="{{ "/" | relURL }}">
      <img class="wordmark-logo" src="{{ "images/logo.png" | relURL }}" alt="" width="256" height="205">
      <span class="wordmark-text">{{ .Site.Title }}</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      {{ $cur := .RelPermalink }}
      {{ range .Site.Menus.main }}
        <a href="{{ .URL | relURL }}"{{ if eq $cur (.URL | relURL) }} class="is-current" aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
